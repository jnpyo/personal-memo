                    schemaVersion: "1"
                    comparisonPolicyVersion: review-default-v3
                    cohort:
                      basis: PROPOSAL_CREATED_AT
                      days: 14
                      fromInclusive: 2026-07-25T03:00:00Z
                      toExclusive: 2026-08-08T03:00:00Z
                      maxProposals: 1000
                    proposals:
                      total: 4
                      withApplication: 3
                      currentStates:
                        queued: 0
                        running: 0
                        reviewRequired: 1
                        currentPostponed: 1
                        failed: 0
                        stale: 0
                        applied: 2
                        rejected: 0
                        other: 0
                    latestApplications:
                      none: 1
                      applied: 2
                      undone: 1
                    outcomes:
                      exact: 1
                      corrected: 1
                      userResolved: 1
                      unclassifiable: 0
                      correctedFields:
                        type: 0
                        title: 1
                        tags: 0
                        items: 0
                        due: 0
                    byAnalysisVersion:
                      - route: LOCAL
                        analyzerVersion: fake-v6
                        promptVersion: none
                        localModelVersion: none
                        embeddingModelVersion: none
                        routingPolicyVersion: field-policy-v1
                        proposals:
                          total: 4
                          withApplication: 3
                          currentStates:
                            queued: 0
                            running: 0
                            reviewRequired: 1
                            currentPostponed: 1
                            failed: 0
                            stale: 0
                            applied: 2
                            rejected: 0
                            other: 0
                        latestApplications:
                          none: 1
                          applied: 2
                          undone: 1
                        outcomes:
                          exact: 1
                          corrected: 1
                          userResolved: 1
                          unclassifiable: 0
                          correctedFields:
                            type: 0
                            title: 1
                            tags: 0
                            items: 0
                            due: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          description: >-
            days is not an integer or is outside 1 through 90, or the selected owner/time window
            contains more than 1,000 proposals. The latter returns
            REVIEW_OUTCOME_WINDOW_TOO_LARGE and no partial aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidDays:
                  value:
                    code: VALIDATION_FAILED
                    message: One or more request fields are invalid.
                    fieldErrors:
                      - field: summary.days
                        message: must be greater than or equal to 1
                    correlationId: 8cda55ca-a46e-49ea-8e43-b14d1591ce69
                malformedDays:
                  value:
                    code: VALIDATION_FAILED
                    message: One or more request fields are invalid.
                    fieldErrors:
                      - field: days
