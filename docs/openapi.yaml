openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Personal Memo API
  version: 0.7.0
  description: >-
    Server-session 인증, Milestone 1의 AI-free vertical slice, 외부 모델 없는 결정론적 분석,
    Milestone 5의 privacy-first exact lexical memo-search 계약입니다.
    분석 결과는 제안이며, canonical 태그와 할 일은 사용자 승인 endpoint를
    통해서만 생성됩니다. Cookie-authenticated mutation은 CSRF header가 필요합니다.
    Owner-scoped 요청은 선택적인 X-Expected-Owner-Id client snapshot guard를 지원하지만,
    권한과 실제 owner는 항상 authenticated server principal에서 결정됩니다.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Health
  - name: Authentication
  - name: Memos
  - name: Analysis
  - name: Tasks
  - name: Graph
  - name: Search

paths:
  /health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Check frontend-to-backend connectivity
      security: []
      responses:
        "200":
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/capabilities:
    get:
      tags: [Authentication]
      operationId: getAuthCapabilities
      summary: Discover enabled sign-in and registration methods
      security: []
      responses:
        "200":
          description: Public authentication capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCapabilities"

  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Obtain the current browser-session CSRF token
      security: []
      responses:
        "200":
          description: Token and the server-selected request names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"

  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerLocalAccount
      summary: Create a local account and authenticated server session
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Local account created and session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginWithLocalCredentials
      summary: Establish a server session with local credentials
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAuthSession
      summary: Read the current authenticated internal user
      responses:
        "200":
          description: Current session and usable login methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Idempotently invalidate the current server session
      description: >-
        A server session is optional so a client can safely repeat logout after expiry or a
        successful earlier call. A current CSRF token remains mandatory. When an authenticated
        principal is present, X-Expected-Owner-Id is checked before LogoutFilter invalidates the
        session.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ExpectedOwnerId"
      responses:
        "204":
          description: Session invalidated, or no authenticated session remained.
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"

  /auth/google/link-intent:
    post:
      tags: [Authentication]
      operationId: createGoogleLinkIntent
      summary: Start an explicit Google identity-link operation
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ExpectedOwnerId"
      responses:
        "200":
          description: Short-lived link intent created in the authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleLinkIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"

  /auth/identities/google:
    delete:
      tags: [Authentication]
      operationId: unlinkGoogleIdentity
      summary: Remove Google while preserving another usable login method
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ExpectedOwnerId"
      responses:
        "200":
          description: Updated session after unlinking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"

  /memos:
    parameters:
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Memos]
      operationId: listMemos
      summary: List current raw memo revisions by lifecycle status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MemoStatus"
            default: ACTIVE
        - name: limit
          in: query
          required: false
          description: Requested result bound; the server clamps it to 1–100.
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Owner-scoped memo views ordered by most recently updated first.
          headers:
            Cache-Control:
              description: Raw memo views are never reusable from an HTTP cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      tags: [Memos]
      operationId: createMemo
      summary: Save the first immutable raw memo revision
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoRequest"
      responses:
        "201":
          description: Memo and revision 1 were created.
          headers:
            Location:
              description: URI of the created memo.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /memos/{memoId}:
    parameters:
      - $ref: "#/components/parameters/MemoId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Memos]
      operationId: getMemo
      summary: Read the current raw memo revision
      responses:
        "200":
          description: Current memo view.
          headers:
            Cache-Control:
              description: Raw memo content is never reusable from an HTTP cache.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
    patch:
      tags: [Memos]
      operationId: updateMemo
      summary: Append a new immutable raw memo revision
      description: >-
        expectedRevision provides optimistic concurrency. A successful content edit
        increments currentRevision and marks older unapplied analysis runs STALE.
        clientUpdatedAt and timeZone are an optional pair; the PWA always sends both,
        and retries reuse the original body snapshot and idempotency key.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoRequest"
      responses:
        "200":
          description: Updated current memo view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags: [Memos]
      operationId: trashMemo
      summary: Soft-delete a memo while preserving raw revisions
      description: >-
        Marks the memo TRASHED and pending review runs STALE. Derived records remain
        stored but are hidden from active task and graph projections.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Current TRASHED memo view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /memos/{memoId}/pin:
    parameters:
      - $ref: "#/components/parameters/MemoId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    patch:
      tags: [Memos]
      operationId: updateMemoPin
      summary: Pin or unpin an active memo for graph-home priority
      description: >-
        Updates memo metadata without creating a raw revision or changing any analysis proposal.
        The authenticated owner row is locked before the ACTIVE-state check, and the
        Idempotency-Key is bound to the memo ID and requested pinned value.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinMemoRequest"
      responses:
        "200":
          description: Pin state and whether this request changed it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinMemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /memos/{memoId}/restore:
    parameters:
      - $ref: "#/components/parameters/MemoId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    post:
      tags: [Memos]
      operationId: restoreMemo
      summary: Restore a soft-deleted memo to ACTIVE
      description: Restoring a memo does not revive analysis runs already marked STALE.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Current ACTIVE memo view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /memos/{memoId}/analysis-runs:
    parameters:
      - $ref: "#/components/parameters/MemoId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    post:
      tags: [Analysis]
      operationId: startAnalysis
      summary: Create a deterministically routed, reviewable analysis proposal
      description: >-
        This operation never creates canonical tags, tasks, or graph relations. Date
        interpretation uses client_recorded_at and source_time_zone from the referenced
        immutable memo revision, rather than request time or mutable user settings. A
        Draft 2020-12 and domain-validated local proposal is assessed by a versioned,
        field-level server policy. A clear proposal is persisted with route LOCAL and
        NOT_REQUIRED cloud evidence. For critical ambiguity, the configured gateway returns one
        immutable binding containing an executor identity and a server-owned descriptor with
        transfer mode and gateway, provider, model, and consent-policy versions. The current
        NO_NETWORK Fake adapter needs no consent. An EXTERNAL_MEMO_CONTENT adapter is not called
        unless the authenticated owner's consent pins the exact policy version and a grant
        timestamp no later than the authorization-check instant; future-dated consent also makes
        zero gateway calls. Otherwise the validated local proposal is persisted with route HYBRID,
        status REVIEW_REQUIRED, and outcome CONSENT_REQUIRED. Typed gateway failures, exceptions,
        and invalid enriched proposals also persist a revalidated local fallback with a bounded
        server-owned outcome and never expose provider error text. HYBRID proposal metadata is
        overwritten with the same transfer/gateway/provider/model/policy/outcome evidence, zero
        tool and mutation calls, and the received routing policy/reasons. No path creates canonical
        data before approval. Every new LOCAL, cloud-success, and fallback proposal rebuilds
        providerMetadata from the same bounded server allow-list, including server-matching
        analyzer, prompt, local-model, embedding-model, and routing-policy versions (1–64 characters
        each) plus a required tool-call count from 0 through 100. Compact proposal JSON is limited
        to 65,536 UTF-8 bytes and providerMetadata to 8,192 UTF-8 bytes. Before a gateway call, V16
        examines at most 10 proposal tag candidates and 20 distinct normalized canonical-name/alias
        terms. It queries only the authenticated owner's ACTIVE tags and aliases by exact normalized
        equality, resolves uniqueness from the complete result, and deterministically retains at most
        K=8 candidates as an internal hint. Final owner/reference validation remains authoritative.
        This retrieval reads no raw or related memo and uses no fuzzy/vector search or embedding.
        V15 commits a durable-v1 QUEUED/PENDING run and its PREPARED dispatch before an authorized
        gateway call. The dispatch reserves the proposal identity and stores the idempotency/request
        hashes, exact validated local proposal and hash, immutable executor binding identity, timeout,
        maximum attempts, and deadline. V16 adds the serialized context, SHA-256 hash, version, and
        candidate count to that pre-call snapshot. Existing V15 dispatches remain none/0/null
        raw/null hash rather than receiving invented context. V17 marks new dispatches
        gateway-attempt-v1 and records one internal owner-scoped row per claimed fence, up to the
        persisted maximum attempts. Historical dispatches remain attempt_history_version=none and
        receive no backfilled rows. A short claim transaction compares the
        current binding identity and exact
        descriptor, rechecks authorization, and acquires a deadline-clipped lease with a new fence.
        The bounded gateway invocation then runs outside every database transaction. Finalization
        locks and rechecks memo ownership, active state, revision, and dispatch fence, then
        atomically stores the proposal, final run evidence, finalized dispatch, and idempotency
        response. It scrubs the serialized context while retaining its hash, version, and candidate
        count. A revision change is committed as STALE before this operation returns 409
        STALE_MEMO_REVISION; stale detected before a provider attempt uses the internal
        CANCELLED_STALE outcome and makes zero gateway calls. The endpoint remains synchronous and
        never returns its internal QUEUED, RUNNING, or PENDING states. A same-key live lease or call
        that exceeds the coordination window returns 409 ANALYSIS_IN_PROGRESS; the caller retries
        with the same idempotency key and identical body. Caller-driven expired-lease recovery
        remains available. In the production profile, a bounded scheduler also runs with a 30-second
        initial/fixed delay and selects at most 25 PREPARED or expired-lease RUNNING dispatches per
        cycle. Owner and the existing raw idempotency key come only from owner-consistent database
        rows; each candidate reuses the owner+operation+raw-key advisory transaction lock and live
        leases are skipped. Recovery after restart therefore reuses the persisted binding, deadline,
        attempt count, lease/fence, exact V16 database context snapshot, bounded out-of-transaction
        Fake call, V17 fence observation, revision-rechecking finalization, and the same
        provider-request token. Any gateway result is STARTED. Executor rejection proves
        NOT_STARTED and is distinct from a gateway-returned UNAVAILABLE. After submission, timeout,
        caller interruption, or unexpected local termination is STARTED when start was observed and
        otherwise UNKNOWN, never NOT_STARTED. Those terminations and process loss leave remote result
        truth UNKNOWN. An
        obsolete-fence completion records only the result actually observed and cannot overwrite the
        run. Observed local elapsed uses a monotonic clock; process-loss duration is unknown.
        A local termination observation for the no-model Fake keeps model-token/cost evidence
        NOT_APPLICABLE with null numbers even when start is uncertain, while observation-free
        process-loss evidence is UNKNOWN. A future real-model attempt is NOT_APPLICABLE only when
        definitively NOT_STARTED, UNKNOWN when execution or remote completion is uncertain, and
        NOT_REPORTED after an observed result until usage/cost reporting is wired; missing evidence is
        never replaced by zero. Retrieval is not
        rerun, so the same token cannot be retried with different context. This is an
        at-least-once transport boundary, not exactly-once, so a real provider must honor that token
        idempotently. Internal authorization/grant evidence, raw recovery key, provider token,
        prepared payload/context, context hash/version/count, attempt ledger, dispatch binding,
        queued/running state, lease, and fence are never returned in RunView, proposal JSON,
        providerMetadata, UI, evaluation reports, recovery responses, ordinary logs, browser storage,
        or service-worker caches. Attempt rows store no provider text or identifier, request token,
        raw memo, or retrieval context and follow current run-data retention until an approved purge
        policy; V17 adds no arbitrary TTL. The public POST and every response schema remain unchanged
        and synchronous. Numeric real-model usage/cost reporting and aggregation, related-memo
        retrieval, fuzzy/vector search, embeddings, and a configured real provider or Ollama/LiquidAI
        adapter remain absent.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAnalysisRequest"
      responses:
        "200":
          description: Synchronous analysis finalized and returned a review-required run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRunView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-proposals/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Analysis]
      operationId: getAnalysisProposal
      summary: Read an untrusted, non-canonical analysis proposal
      parameters:
        - $ref: "#/components/parameters/AnalysisProposalSchemaVersion"
      responses:
        "200":
          description: >-
            Negotiated structured proposal. Omitting X-Analysis-Proposal-Schema-Version or
            requesting 1 returns a strict version-1 projection. Requesting 2 returns the stored
            version: new Fake analyses are version 2 with explicit TASK-to-due-date candidate
            references, while historical version-1 proposals remain version 1.
          headers:
            Cache-Control:
              description: Proposal responses are owner-scoped and are never stored by caches.
              schema:
                type: string
                const: no-store
            Vary:
              description: Caches must keep proposal schema representations separate.
              schema:
                type: string
                const: X-Analysis-Proposal-Schema-Version
          content:
            application/json:
              schema:
                $ref: ../contracts/analysis-proposal.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-proposals/{proposalId}/relation-review-candidates:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Analysis]
      operationId: listRelationReviewCandidates
      summary: Resolve owner-visible labels for relation review
      description: >-
        Returns one bounded entry for every stored relationCandidates element, in proposal-array
        order. The proposal index is the only selector later accepted by Apply; the client never
        resubmits target/type/score as authority. An ACTIVE owner target receives a bounded current
        raw-memo preview or canonical tag name. A missing, foreign, trashed, or inactive target is
        returned as unavailable with no label, and Apply rechecks every selected target while
        holding the canonical row. This read creates no canonical data and does not imply that the
        untrusted proposal has been approved.
      responses:
        "200":
          description: Ordered, owner-scoped relation review labels for the proposal.
          headers:
            Cache-Control:
              description: Relation review labels are private and are never stored by caches.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/RelationReviewCandidateView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-proposals:
    parameters:
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Analysis]
      operationId: listRecoverableAnalysisProposals
      summary: List recoverable proposals awaiting review
      parameters:
        - $ref: "#/components/parameters/AnalysisProposalSchemaVersion"
        - name: status
          in: query
          required: true
          schema:
            enum: [REVIEW_REQUIRED, POSTPONED]
        - name: limit
          in: query
          required: false
          description: Requested result bound; the server clamps it to 1–100.
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: >-
            Newest owner-scoped proposals in the requested review state whose memo is
            ACTIVE and whose analyzed revision is still current. Omitting
            X-Analysis-Proposal-Schema-Version or requesting 1 returns strict version-1
            projections; requesting 2 preserves each stored version.
          headers:
            Cache-Control:
              description: Proposal recovery responses are owner-scoped and are never cached.
              schema:
                type: string
                const: no-store
            Vary:
              description: Caches must keep proposal schema representations separate.
              schema:
                type: string
                const: X-Analysis-Proposal-Schema-Version
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/ProposalRecoveryView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-proposals/{proposalId}/apply:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    post:
      tags: [Analysis]
      operationId: applyAnalysisProposal
      summary: Apply only the user's reviewed selection
      description: >-
        Validates owner, current memo revision, tags, items, due values, and the user's explicit
        relation-candidate indexes, then creates the application and all selected derived records
        in one transaction.
        The due timeZone request field is compatibility input only; persisted task source time zones
        are canonicalized from the locked immutable memo revision.
        For each selected proposal index the server resolves the full relation from the locked
        stored proposal, requires its sourceCandidateId to map to exactly one applied item, and
        re-locks the owner-owned ACTIVE MEMO or TAG target. The request cannot choose a target,
        relation type, or score. An explicit empty selectedRelations array rejects every relation
        candidate while applying the other reviewed fields. Legacy omission is accepted only when
        the proposal itself has no relation candidates. Confirmed item-scoped relations are
        application-owned and undo removes them before their source items. They are intentionally
        not projected into the current MEMO_TAG graph until a separate edge-semantics decision.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
