    get:
      tags: [Analysis]
      operationId: getAnalysisReviewOutcomeSummary
      summary: Read an owner-scoped aggregate of recent proposal review outcomes
      description: >-
        Returns aggregate counters only for proposals owned by the authenticated server principal.
        The rolling cohort is selected by analysis_proposals.created_at in the half-open interval
        [fromInclusive, toExclusive). The server reads at most 1,001 rows to enforce a hard 1,000
        proposal cap and returns 422 rather than a partial summary when the cap is exceeded. Current
        run state, latest application state, and comparison of the latest stored selection are
        independent dimensions. EXACT means only that the user applied the reconstructed default
        review selection without a semantic edit; it is not an AI correctness or accuracy label.
        The response never contains memo text, titles, proposal/application identifiers, raw
        proposal JSON, or selection JSON. This endpoint is read-only and does not collect a general
        clickstream.
      parameters:
        - name: days
