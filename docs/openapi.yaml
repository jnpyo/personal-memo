openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Personal Memo API
  version: 0.4.0
  description: >-
    Server-session 인증, Milestone 1의 AI-free vertical slice와 외부 모델 없는 결정론적 분석 계약입니다.
    분석 결과는 제안이며, canonical 태그와 할 일은 사용자 승인 endpoint를
    통해서만 생성됩니다. Cookie-authenticated mutation은 CSRF header가 필요합니다.
    Owner-scoped 요청은 선택적인 X-Expected-Owner-Id client snapshot guard를 지원하지만,
    권한과 실제 owner는 항상 authenticated server principal에서 결정됩니다.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Health
  - name: Authentication
  - name: Memos
  - name: Analysis
  - name: Tasks
  - name: Graph

paths:
  /health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Check frontend-to-backend connectivity
      security: []
      responses:
        "200":
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/capabilities:
    get:
      tags: [Authentication]
      operationId: getAuthCapabilities
      summary: Discover enabled sign-in and registration methods
      security: []
      responses:
        "200":
          description: Public authentication capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCapabilities"

  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Obtain the current browser-session CSRF token
      security: []
      responses:
        "200":
          description: Token and the server-selected request names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"

  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerLocalAccount
      summary: Create a local account and authenticated server session
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Local account created and session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginWithLocalCredentials
      summary: Establish a server session with local credentials
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAuthSession
      summary: Read the current authenticated internal user
      responses:
        "200":
          description: Current session and usable login methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Idempotently invalidate the current server session
      description: >-
        A server session is optional so a client can safely repeat logout after expiry or a
        successful earlier call. A current CSRF token remains mandatory. When an authenticated
        principal is present, X-Expected-Owner-Id is checked before LogoutFilter invalidates the
        session.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ExpectedOwnerId"
      responses:
        "204":
          description: Session invalidated, or no authenticated session remained.
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"

  /auth/google/link-intent:
    post:
      tags: [Authentication]
      operationId: createGoogleLinkIntent
      summary: Start an explicit Google identity-link operation
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ExpectedOwnerId"
      responses:
        "200":
          description: Short-lived link intent created in the authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleLinkIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"

  /auth/identities/google:
    delete:
      tags: [Authentication]
      operationId: unlinkGoogleIdentity
      summary: Remove Google while preserving another usable login method
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ExpectedOwnerId"
      responses:
        "200":
          description: Updated session after unlinking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"

  /memos:
    parameters:
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Memos]
      operationId: listMemos
      summary: List current raw memo revisions by lifecycle status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MemoStatus"
            default: ACTIVE
        - name: limit
          in: query
          required: false
          description: Requested result bound; the server clamps it to 1–100.
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Owner-scoped memo views ordered by most recently updated first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      tags: [Memos]
      operationId: createMemo
      summary: Save the first immutable raw memo revision
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoRequest"
      responses:
        "201":
          description: Memo and revision 1 were created.
          headers:
            Location:
              description: URI of the created memo.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /memos/{memoId}:
    parameters:
      - $ref: "#/components/parameters/MemoId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Memos]
      operationId: getMemo
      summary: Read the current raw memo revision
      responses:
        "200":
          description: Current memo view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
    patch:
      tags: [Memos]
      operationId: updateMemo
      summary: Append a new immutable raw memo revision
      description: >-
        expectedRevision provides optimistic concurrency. A successful content edit
        increments currentRevision and marks older unapplied analysis runs STALE.
        clientUpdatedAt and timeZone are an optional pair; the PWA always sends both,
        and retries reuse the original body snapshot and idempotency key.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoRequest"
      responses:
        "200":
          description: Updated current memo view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Memos]
      operationId: trashMemo
      summary: Soft-delete a memo while preserving raw revisions
      description: >-
        Marks the memo TRASHED and pending review runs STALE. Derived records remain
        stored but are hidden from active task and graph projections.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Current TRASHED memo view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /memos/{memoId}/restore:
    parameters:
      - $ref: "#/components/parameters/MemoId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    post:
      tags: [Memos]
      operationId: restoreMemo
      summary: Restore a soft-deleted memo to ACTIVE
      description: Restoring a memo does not revive analysis runs already marked STALE.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Current ACTIVE memo view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /memos/{memoId}/analysis-runs:
    parameters:
      - $ref: "#/components/parameters/MemoId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    post:
      tags: [Analysis]
      operationId: startAnalysis
      summary: Create a deterministically routed, reviewable analysis proposal
      description: >-
        This operation never creates canonical tags, tasks, or graph relations. Date
        interpretation uses client_recorded_at and source_time_zone from the referenced
        immutable memo revision, rather than request time or mutable user settings. A
        Draft 2020-12 and domain-validated local proposal is assessed by a versioned,
        field-level server policy. A clear proposal is persisted with route LOCAL and
        NOT_REQUIRED cloud evidence. For critical ambiguity, the configured gateway returns one
        immutable binding containing an executor identity and a server-owned descriptor with
        transfer mode and gateway, provider, model, and consent-policy versions. The current
        NO_NETWORK Fake adapter needs no consent. An EXTERNAL_MEMO_CONTENT adapter is not called
        unless the authenticated owner's consent pins the exact policy version and a grant
        timestamp no later than the authorization-check instant; future-dated consent also makes
        zero gateway calls. Otherwise the validated local proposal is persisted with route HYBRID,
        status REVIEW_REQUIRED, and outcome CONSENT_REQUIRED. Typed gateway failures, exceptions,
        and invalid enriched proposals also persist a revalidated local fallback with a bounded
        server-owned outcome and never expose provider error text. HYBRID proposal metadata is
        overwritten with the same transfer/gateway/provider/model/policy/outcome evidence, zero
        tool and mutation calls, and the received routing policy/reasons. No path creates canonical
        data before approval. Every new LOCAL, cloud-success, and fallback proposal rebuilds
        providerMetadata from the same bounded server allow-list, including server-matching
        analyzer, prompt, local-model, embedding-model, and routing-policy versions (1–64 characters
        each) plus a required tool-call count from 0 through 100. Compact proposal JSON is limited
        to 65,536 UTF-8 bytes and providerMetadata to 8,192 UTF-8 bytes. V15 commits a durable-v1
        QUEUED/PENDING run and its PREPARED dispatch before an authorized gateway call. The dispatch
        reserves the proposal identity and stores the idempotency/request hashes, exact validated
        local proposal and hash, immutable executor binding identity, timeout, maximum attempts, and
        deadline. A short claim transaction compares the current binding identity and exact
        descriptor, rechecks authorization, and acquires a deadline-clipped lease with a new fence.
        The bounded gateway invocation then runs outside every database transaction. Finalization
        locks and rechecks memo ownership, active state, revision, and dispatch fence, then
        atomically stores the proposal, final run evidence, finalized dispatch, and idempotency
        response. A revision change is committed as STALE before this operation returns 409
        STALE_MEMO_REVISION; stale detected before a provider attempt uses the internal
        CANCELLED_STALE outcome and makes zero gateway calls. The endpoint remains synchronous and
        never returns its internal QUEUED, RUNNING, or PENDING states. A same-key live lease or call
        that exceeds the coordination window returns 409 ANALYSIS_IN_PROGRESS; the caller retries
        with the same idempotency key and identical body. Expired-lease recovery is caller-driven,
        bounded by the persisted deadline and attempt count, fenced against late finalization, and
        reuses the same provider-request token. This is an at-least-once transport boundary, so a
        real provider must honor that token idempotently. Internal authorization/grant evidence,
        provider token, dispatch proposal, binding, lease, and fence are never returned in RunView,
        proposal JSON, providerMetadata, or recovery responses. There is no background worker,
        automatic restart recovery, per-attempt history, duration/model-token/cost metrics, top-k
        context, or configured real provider.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAnalysisRequest"
      responses:
        "200":
          description: Synchronous analysis finalized and returned a review-required run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRunView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-proposals/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Analysis]
      operationId: getAnalysisProposal
      summary: Read an untrusted, non-canonical analysis proposal
      parameters:
        - $ref: "#/components/parameters/AnalysisProposalSchemaVersion"
      responses:
        "200":
          description: >-
            Negotiated structured proposal. Omitting X-Analysis-Proposal-Schema-Version or
            requesting 1 returns a strict version-1 projection. Requesting 2 returns the stored
            version: new Fake analyses are version 2 with explicit TASK-to-due-date candidate
            references, while historical version-1 proposals remain version 1.
          headers:
            Cache-Control:
              description: Proposal responses are owner-scoped and are never stored by caches.
              schema:
                type: string
                const: no-store
            Vary:
              description: Caches must keep proposal schema representations separate.
              schema:
                type: string
                const: X-Analysis-Proposal-Schema-Version
          content:
            application/json:
              schema:
                $ref: ../contracts/analysis-proposal.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-proposals:
    parameters:
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Analysis]
      operationId: listRecoverableAnalysisProposals
      summary: List recoverable proposals awaiting review
      parameters:
        - $ref: "#/components/parameters/AnalysisProposalSchemaVersion"
        - name: status
          in: query
          required: true
          schema:
            enum: [REVIEW_REQUIRED, POSTPONED]
        - name: limit
          in: query
          required: false
          description: Requested result bound; the server clamps it to 1–100.
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: >-
            Newest owner-scoped proposals in the requested review state whose memo is
            ACTIVE and whose analyzed revision is still current. Omitting
            X-Analysis-Proposal-Schema-Version or requesting 1 returns strict version-1
            projections; requesting 2 preserves each stored version.
          headers:
            Cache-Control:
              description: Proposal recovery responses are owner-scoped and are never cached.
              schema:
                type: string
                const: no-store
            Vary:
              description: Caches must keep proposal schema representations separate.
              schema:
                type: string
                const: X-Analysis-Proposal-Schema-Version
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/ProposalRecoveryView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-proposals/{proposalId}/apply:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    post:
      tags: [Analysis]
      operationId: applyAnalysisProposal
      summary: Apply only the user's reviewed selection
      description: >-
        Validates owner, current memo revision, tags, items, and due values, then
        creates the application and all currently supported derived records in one transaction.
        The due timeZone request field is compatibility input only; persisted task source time zones
        are canonicalized from the locked immutable memo revision.
        A proposal with a non-empty relationCandidates array fails closed with
        PROPOSAL_RELATIONS_UNSUPPORTED until explicit relation selection, canonical relation
        persistence, and application-scoped undo are implemented. No partial application occurs.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyProposalRequest"
      responses:
        "200":
          description: Reviewed selection was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
              examples:
                applied:
                  value:
                    applicationId: 1b49505a-7615-4250-a82e-254525465baf
                    status: APPLIED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ApplyConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-proposals/{proposalId}/reject:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    post:
      tags: [Analysis]
      operationId: rejectAnalysisProposal
      summary: Reject a proposal without creating canonical data
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Proposal was rejected; raw memo remains unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDispositionView"
              examples:
                rejected:
                  value:
                    proposalId: 6b41133d-e81a-4751-b4b0-623b8c794bf3
                    status: REJECTED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-proposals/{proposalId}/postpone:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    post:
      tags: [Analysis]
      operationId: postponeAnalysisProposal
      summary: Postpone a proposal without creating canonical data
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Proposal is marked POSTPONED and can be reviewed later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDispositionView"
              examples:
                postponed:
                  value:
                    proposalId: 6b41133d-e81a-4751-b4b0-623b8c794bf3
                    status: POSTPONED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-applications/{applicationId}/undo:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    post:
      tags: [Analysis]
      operationId: undoAnalysisApplication
      summary: Remove derived records while preserving raw memo revisions
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Application is now UNDONE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
              examples:
                undone:
                  value:
                    applicationId: 1b49505a-7615-4250-a82e-254525465baf
                    status: UNDONE
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-applications/latest:
    parameters:
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Analysis]
      operationId: getLatestAnalysisApplication
      summary: Recover the latest application state for undo UI
      responses:
        "200":
          description: >-
            Latest owner-scoped application, or an explicit NONE state when the owner
            has no application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationRecoveryView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"

  /analysis-review-outcomes/summary:
    parameters:
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Analysis]
      operationId: getAnalysisReviewOutcomeSummary
      summary: Read an owner-scoped aggregate of recent proposal review outcomes
      description: >-
        Returns aggregate counters only for proposals owned by the authenticated server principal.
        The rolling cohort is selected by analysis_proposals.created_at in the half-open interval
        [fromInclusive, toExclusive). The server reads at most 1,001 rows to enforce a hard 1,000
        proposal cap and returns 422 rather than a partial summary when the cap is exceeded. Current
        run state, latest application state, and comparison of the latest stored selection are
        independent dimensions. EXACT means only that the user applied the reconstructed default
        review selection without a semantic edit; it is not an AI correctness or accuracy label.
        The response never contains memo text, titles, proposal/application identifiers, raw
        proposal JSON, or selection JSON. This endpoint is read-only and does not collect a general
        clickstream.
      parameters:
        - name: days
          in: query
          required: false
          description: Rolling number of 24-hour periods ending at the server's current instant.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        "200":
          description: Owner-scoped, raw-content-free review outcome aggregate.
          headers:
            Cache-Control:
              description: Prevents storage or reuse of this owner-specific aggregate.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisReviewOutcomeSummary"
              examples:
                recentReviewOutcomes:
                  value:
                    schemaVersion: "1"
                    comparisonPolicyVersion: review-default-v3
                    cohort:
                      basis: PROPOSAL_CREATED_AT
                      days: 14
                      fromInclusive: 2026-07-25T03:00:00Z
                      toExclusive: 2026-08-08T03:00:00Z
                      maxProposals: 1000
                    proposals:
                      total: 4
                      withApplication: 3
                      currentStates:
                        queued: 0
                        running: 0
                        reviewRequired: 1
                        currentPostponed: 1
                        failed: 0
                        stale: 0
                        applied: 2
                        rejected: 0
                        other: 0
                    latestApplications:
                      none: 1
                      applied: 2
                      undone: 1
                    outcomes:
                      exact: 1
                      corrected: 1
                      userResolved: 1
                      unclassifiable: 0
                      correctedFields:
                        type: 0
                        title: 1
                        tags: 0
                        items: 0
                        due: 0
                    byAnalysisVersion:
                      - route: LOCAL
                        analyzerVersion: fake-v6
                        promptVersion: none
                        localModelVersion: none
                        embeddingModelVersion: none
                        routingPolicyVersion: field-policy-v1
                        proposals:
                          total: 4
                          withApplication: 3
                          currentStates:
                            queued: 0
                            running: 0
                            reviewRequired: 1
                            currentPostponed: 1
                            failed: 0
                            stale: 0
                            applied: 2
                            rejected: 0
                            other: 0
                        latestApplications:
                          none: 1
                          applied: 2
                          undone: 1
                        outcomes:
                          exact: 1
                          corrected: 1
                          userResolved: 1
                          unclassifiable: 0
                          correctedFields:
                            type: 0
                            title: 1
                            tags: 0
                            items: 0
                            due: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          description: >-
            days is not an integer or is outside 1 through 90, or the selected owner/time window
            contains more than 1,000 proposals. The latter returns
            REVIEW_OUTCOME_WINDOW_TOO_LARGE and no partial aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidDays:
                  value:
                    code: VALIDATION_FAILED
                    message: One or more request fields are invalid.
                    fieldErrors:
                      - field: summary.days
                        message: must be greater than or equal to 1
                    correlationId: 8cda55ca-a46e-49ea-8e43-b14d1591ce69
                malformedDays:
                  value:
                    code: VALIDATION_FAILED
                    message: One or more request fields are invalid.
                    fieldErrors:
                      - field: days
                        message: must be a valid value
                    correlationId: 8cda55ca-a46e-49ea-8e43-b14d1591ce69
                proposalCapExceeded:
                  value:
                    code: REVIEW_OUTCOME_WINDOW_TOO_LARGE
                    message: The selected window contains more than 1000 analysis proposals.
                    fieldErrors: []
                    correlationId: 8cda55ca-a46e-49ea-8e43-b14d1591ce69

  /tasks:
    parameters:
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List confirmed task facets for the authenticated owner
      responses:
        "200":
          description: Tasks with derived overdue state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"

  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/ExpectedOwnerId"
    patch:
      tags: [Tasks]
      operationId: updateTaskStatus
      summary: Change a task's persisted source status
      description: OVERDUE is derived and cannot be written as a source status.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Task status result. updated is false when no source-state change was needed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskUpdateView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /graph/home:
    parameters:
      - $ref: "#/components/parameters/ExpectedOwnerId"
    get:
      tags: [Graph]
      operationId: getGraphHome
      summary: Project a bounded memo-tag graph from canonical data
      parameters:
        - name: limit
          in: query
          required: false
          description: Requested node bound; the server clamps it to 1–100.
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Canonical memo/tag projection. System type remains node metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphProjection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OwnerOrDomainConflict"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Opaque, revocable server session. The cookie is HttpOnly in the browser.

  parameters:
    ExpectedOwnerId:
      name: X-Expected-Owner-Id
      in: header
      required: false
      description: >-
        Authenticated user ID captured by the client when this request starts. This is
        only a cross-tab/session-race guard and never selects an owner or grants access;
        the server principal remains the sole authorization source. When an authenticated
        principal exists, a malformed UUID or a different value returns 409
        SESSION_OWNER_CHANGED before the endpoint mutates domain or idempotency state.
        Anonymous idempotent logout has no owner to compare. Omitting the header is allowed.
      schema:
        type: string
        format: uuid
    AnalysisProposalSchemaVersion:
      name: X-Analysis-Proposal-Schema-Version
      in: header
      required: false
      description: >-
        Maximum proposal schema understood by the client. Omission and value 1 return a strict
        version-1 representation for forward compatibility with an installed older PWA. Value 2
        allows a stored version-2 proposal; a historical stored version-1 proposal remains version
        1. Any other or combined value returns 422 UNSUPPORTED_PROPOSAL_SCHEMA_VERSION.
      schema:
        type: string
        enum: ["1", "2"]
        default: "1"
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Value returned by `GET /auth/csrf`; required for cookie-authenticated mutations.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        1–128 character retry identity. Replaying the same operation and request returns
        the stored response; reusing the key for a different request returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MemoId:
      name: memoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: >-
        No valid authenticated server session exists, or the account was disabled.
        Typical codes are AUTHENTICATION_REQUIRED and ACCOUNT_DISABLED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            authenticationRequired:
              value:
                code: AUTHENTICATION_REQUIRED
                message: Authentication is required.
                fieldErrors: []
                correlationId: 8cda55ca-a46e-49ea-8e43-b14d1591ce69
    CsrfForbidden:
      description: >-
        The cookie-authenticated mutation did not include the current CSRF token.
        The response code is CSRF_TOKEN_INVALID and no domain mutation occurs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidCsrf:
              value:
                code: CSRF_TOKEN_INVALID
                message: A valid CSRF token is required.
                fieldErrors: []
                correlationId: 8cda55ca-a46e-49ea-8e43-b14d1591ce69
    OwnerOrDomainConflict:
      description: >-
        When an authenticated principal exists on an endpoint carrying X-Expected-Owner-Id,
        a malformed value or a different owner returns SESSION_OWNER_CHANGED before domain
        or idempotency state changes. Anonymous idempotent logout has no owner to compare.
        The endpoint may also return its documented revision, lifecycle, identity, or
        idempotency conflict code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            sessionOwnerChanged:
              value:
                code: SESSION_OWNER_CHANGED
                message: The authenticated account changed before this request was sent.
                fieldErrors: []
                correlationId: 8cda55ca-a46e-49ea-8e43-b14d1591ce69
    ApplyConflict:
      description: >-
        The owner snapshot, revision, proposal lifecycle, tag identity, or idempotency state
        conflicts with the request. A validated proposal with non-empty relationCandidates also
        returns PROPOSAL_RELATIONS_UNSUPPORTED until explicit relation selection, persistence, and
        undo are supported; no application or derived record is created.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            sessionOwnerChanged:
              value:
                code: SESSION_OWNER_CHANGED
                message: The authenticated account changed before this request was sent.
                fieldErrors: []
                correlationId: 8cda55ca-a46e-49ea-8e43-b14d1591ce69
            relationsUnsupported:
              value:
                code: PROPOSAL_RELATIONS_UNSUPPORTED
                message: Relation candidates require explicit relation selection, which is not supported yet.
                fieldErrors: []
                correlationId: 8cda55ca-a46e-49ea-8e43-b14d1591ce69
    Forbidden:
      description: CSRF validation or another authenticated access rule failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource is absent or outside the current owner scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Revision, proposal state, resource identity, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: JSON, header, bean, schema, or domain validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    LoginMethod:
      type: string
      enum: [LOCAL, GOOGLE]

    AuthCapabilities:
      type: object
      additionalProperties: false
      required: [registrationEnabled, googleEnabled, googleRegistrationEnabled]
      properties:
        registrationEnabled:
          type: boolean
        googleEnabled:
          type: boolean
          description: >-
            True only when Google authentication is explicitly enabled and the server
            started with non-blank client credential settings. It does not prove that
            Google has accepted those credentials. Existing linked identities and explicit
            linking remain available when this is true. Google authentication itself is false
            by default.
        googleRegistrationEnabled:
          type: boolean
          description: >-
            True only when googleEnabled is true and the separate Google account-creation policy
            is enabled. It tells a client whether an unseen Google identity may create a new
            internal user before starting OAuth. The default and production value is false;
            attempts are then rejected with GOOGLE_REGISTRATION_DISABLED while existing linked
            identities and explicit linking remain available.

    CsrfToken:
      type: object
      additionalProperties: false
      required: [headerName, parameterName, token]
      properties:
        headerName:
          type: string
        parameterName:
          type: string
        token:
          type: string

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName, timeZone]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Also limited to the configured password encoder's safe UTF-8 byte length.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          examples: [Asia/Seoul]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    AuthSession:
      type: object
      additionalProperties: false
      required: [userId, email, displayName, loginMethods]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        loginMethods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LoginMethod"

    GoogleLinkIntent:
      type: object
      additionalProperties: false
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          description: Same-origin server endpoint for starting Google authorization.
          examples: [/oauth2/authorization/google]

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: UP

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        correlationId:
          type: string
          format: uuid
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    CreateMemoRequest:
      type: object
      additionalProperties: false
      required: [id, content, clientCreatedAt, timeZone]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 20000
        clientCreatedAt:
          type: string
          format: date-time
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          examples: [Asia/Seoul]
    UpdateMemoRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, content]
      dependentRequired:
        clientUpdatedAt: [timeZone]
        timeZone: [clientUpdatedAt]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        content:
          type: string
          minLength: 1
          maxLength: 20000
        clientUpdatedAt:
          type: string
          format: date-time
          description: Client-recorded time for this immutable revision.
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          examples: [Asia/Seoul]
          description: IANA time zone captured with clientUpdatedAt.
    MemoStatus:
      enum: [ACTIVE, TRASHED]
    MemoView:
      type: object
      additionalProperties: false
      required: [id, currentRevision, content, status, analysisState, createdAt]
      properties:
        id:
          type: string
          format: uuid
        currentRevision:
          type: integer
          minimum: 1
        content:
          type: string
        status:
          $ref: "#/components/schemas/MemoStatus"
        analysisState:
          type: string
        createdAt:
          type: string
          format: date-time

    StartAnalysisRequest:
      type: object
      additionalProperties: false
      required: [memoRevision, policy]
      properties:
        memoRevision:
          type: integer
          minimum: 1
        policy:
          const: AUTO
    AnalysisRunView:
      type: object
      additionalProperties: false
      required: [id, memoId, memoRevision, status, proposalId]
      properties:
        id:
          type: string
          format: uuid
        memoId:
          type: string
          format: uuid
        memoRevision:
          type: integer
          minimum: 1
        status:
          const: REVIEW_REQUIRED
        proposalId:
          type: string
          format: uuid
    ProposalRecoveryView:
      type: object
      additionalProperties: false
      required: [proposalId, status, createdAt, proposal]
      properties:
        proposalId:
          type: string
          format: uuid
        status:
          enum: [REVIEW_REQUIRED, POSTPONED]
        createdAt:
          type: string
          format: date-time
        proposal:
          $ref: ../contracts/analysis-proposal.schema.json

    ItemKind:
      enum: [TASK, EVENT, INFORMATION, IDEA, RECORD]
    DatePrecision:
      enum: [EXACT_TIME, DATE_ONLY, RELATIVE_EXACT, APPROXIMATE, UNKNOWN]
    SelectedTag:
      type: object
      additionalProperties: false
      properties:
        existingTagId:
          type: [string, "null"]
          format: uuid
        newCanonicalName:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
      oneOf:
        - required: [existingTagId]
          properties:
            existingTagId:
              type: string
              format: uuid
            newCanonicalName:
              type: "null"
        - required: [newCanonicalName]
          properties:
            existingTagId:
              type: "null"
            newCanonicalName:
              type: string
              minLength: 1
              maxLength: 100
    DueSelection:
      type: object
      additionalProperties: false
      required: [surfaceText, value, precision, timeZone, timeSpecified]
      description: >-
        DATE_ONLY uses an ISO date with timeSpecified=false. EXACT_TIME and
        RELATIVE_EXACT use an offset timestamp with timeSpecified=true.
        APPROXIMATE and UNKNOWN require a null value and are never coerced to an instant. The
        timeZone field remains a validated compatibility input, but the server replaces it with
        the immutable memo revision's source time zone before persisting task_details.
      properties:
        surfaceText:
          type: string
          minLength: 1
          maxLength: 100
        value:
          type: [string, "null"]
          maxLength: 100
        precision:
          $ref: "#/components/schemas/DatePrecision"
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Recognized IANA compatibility input. It cannot select the canonical persisted zone;
            task_details.source_time_zone comes from the immutable analyzed memo revision.
        timeSpecified:
          type: boolean
    ApplyItem:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          minLength: 1
          maxLength: 200
        due:
          oneOf:
            - $ref: "#/components/schemas/DueSelection"
            - type: "null"
    ApplyProposalRequest:
      type: object
      additionalProperties: false
      required: [expectedMemoRevision, selectedType, title, selectedTags, items]
      properties:
        expectedMemoRevision:
          type: integer
          minimum: 1
        selectedType:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          minLength: 1
          maxLength: 200
        selectedTags:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/SelectedTag"
        items:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/ApplyItem"
    ApplicationView:
      type: object
      additionalProperties: false
      required: [applicationId, status]
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          enum: [APPLIED, UNDONE]
    ApplicationRecoveryView:
      type: object
      additionalProperties: false
      required: [applicationId, status]
      properties:
        applicationId:
          type: [string, "null"]
          format: uuid
        status:
          enum: [NONE, APPLIED, UNDONE]
      oneOf:
        - properties:
            applicationId:
              type: "null"
            status:
              const: NONE
        - properties:
            applicationId:
              type: string
              format: uuid
            status:
              enum: [APPLIED, UNDONE]
    ReviewOutcomeCount:
      type: integer
      minimum: 0
      maximum: 1000
    ReviewOutcomeCurrentStates:
      type: object
      additionalProperties: false
      description: >-
        Current mutable analysis_runs states. These counters sum to proposals.total.
        currentPostponed is only the current POSTPONED state; a proposal later applied or rejected
        does not preserve an earlier postponement event in this schema.
      required:
        [queued, running, reviewRequired, currentPostponed, failed, stale, applied, rejected, other]
      properties:
        queued:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        running:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        reviewRequired:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        currentPostponed:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        failed:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        stale:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        applied:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        rejected:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        other:
          $ref: "#/components/schemas/ReviewOutcomeCount"
    ReviewOutcomeProposalCounters:
      type: object
      additionalProperties: false
      required: [total, withApplication, currentStates]
      properties:
        total:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        withApplication:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        currentStates:
          $ref: "#/components/schemas/ReviewOutcomeCurrentStates"
    ReviewOutcomeLatestApplications:
      type: object
      additionalProperties: false
      description: >-
        For each proposal, the latest analysis_application ordered by applied_at DESC then id DESC.
        none, applied, and undone sum to proposals.total. Undo followed by a new application uses
        the newer application; this is not a count of every apply or undo event.
      required: [none, applied, undone]
      properties:
        none:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        applied:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        undone:
          $ref: "#/components/schemas/ReviewOutcomeCount"
    ReviewOutcomeCorrectedFields:
      type: object
      additionalProperties: false
      description: >-
        Non-exclusive field counters within CORRECTED outcomes. Each value is less than or equal to
        outcomes.corrected, and one corrected selection may increment multiple fields.
      required: [type, title, tags, items, due]
      properties:
        type:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        title:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        tags:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        items:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        due:
          $ref: "#/components/schemas/ReviewOutcomeCount"
    ReviewOutcomeCounters:
      type: object
      additionalProperties: false
      description: >-
        Comparison of the latest stored selection for every proposal with an application. EXACT,
        CORRECTED, USER_RESOLVED, and UNCLASSIFIABLE sum to proposals.withApplication and are
        independent of current run state and APPLIED/UNDONE state. EXACT means unchanged selection,
        not AI correctness. A non-empty relation proposal is UNCLASSIFIABLE because relations are
        outside the current apply contract.
      required: [exact, corrected, userResolved, unclassifiable, correctedFields]
      properties:
        exact:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        corrected:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        userResolved:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        unclassifiable:
          $ref: "#/components/schemas/ReviewOutcomeCount"
        correctedFields:
          $ref: "#/components/schemas/ReviewOutcomeCorrectedFields"
    ReviewOutcomeCohort:
      type: object
      additionalProperties: false
      description: Rolling proposal-created-at cohort represented as a half-open UTC interval.
      required: [basis, days, fromInclusive, toExclusive, maxProposals]
      properties:
        basis:
          const: PROPOSAL_CREATED_AT
        days:
          type: integer
          minimum: 1
          maximum: 90
        fromInclusive:
          type: string
          format: date-time
        toExclusive:
          type: string
          format: date-time
        maxProposals:
          type: integer
          const: 1000
    ReviewOutcomeAnalysisVersion:
      type: object
      additionalProperties: false
      description: >-
        Counters grouped only by server-owned run route and provenance. Summing each counter across
        this array reproduces the corresponding top-level counter.
      required:
        - route
        - analyzerVersion
        - promptVersion
        - localModelVersion
        - embeddingModelVersion
        - routingPolicyVersion
        - proposals
        - latestApplications
        - outcomes
      properties:
        route:
          type: string
          enum: [MOCK, LOCAL, CLOUD, HYBRID]
        analyzerVersion:
          type: string
          minLength: 1
          maxLength: 64
        promptVersion:
          type: string
          minLength: 1
          maxLength: 64
        localModelVersion:
          type: string
          minLength: 1
          maxLength: 64
        embeddingModelVersion:
          type: string
          minLength: 1
          maxLength: 64
        routingPolicyVersion:
          type: string
          minLength: 1
          maxLength: 64
        proposals:
          $ref: "#/components/schemas/ReviewOutcomeProposalCounters"
        latestApplications:
          $ref: "#/components/schemas/ReviewOutcomeLatestApplications"
        outcomes:
          $ref: "#/components/schemas/ReviewOutcomeCounters"
    AnalysisReviewOutcomeSummary:
      type: object
      additionalProperties: false
      description: >-
        Owner-scoped aggregate only. It contains no raw memo/proposal/selection content and no memo,
        proposal, application, task, tag, or relation identifiers. The three counter dimensions are
        intentionally independent and must not be presented as an AI accuracy score.
      required:
        - schemaVersion
        - comparisonPolicyVersion
        - cohort
        - proposals
        - latestApplications
        - outcomes
        - byAnalysisVersion
      properties:
        schemaVersion:
          const: "1"
        comparisonPolicyVersion:
          const: review-default-v3
          description: >-
            Reconstructs explicit version-2 TASK due references while retaining the former
            conservative single-task/single-date projection only for historical version-1
            proposals.
        cohort:
          $ref: "#/components/schemas/ReviewOutcomeCohort"
        proposals:
          $ref: "#/components/schemas/ReviewOutcomeProposalCounters"
        latestApplications:
          $ref: "#/components/schemas/ReviewOutcomeLatestApplications"
        outcomes:
          $ref: "#/components/schemas/ReviewOutcomeCounters"
        byAnalysisVersion:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ReviewOutcomeAnalysisVersion"
    ReviewDispositionView:
      type: object
      additionalProperties: false
      required: [proposalId, status]
      properties:
        proposalId:
          type: string
          format: uuid
        status:
          enum: [REJECTED, POSTPONED]

    TaskStatus:
      enum: [TODO, DONE, CANCELLED]
    TaskView:
      type: object
      additionalProperties: false
      required: [id, title, status, dueAt, dueDate, overdue]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        dueAt:
          type: [string, "null"]
          format: date-time
        dueDate:
          type: [string, "null"]
          format: date
        overdue:
          type: boolean
          readOnly: true
          description: Derived from TODO, the relevant due representation, now, and source time zone.
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TaskStatus"
    TaskUpdateView:
      type: object
      additionalProperties: false
      required: [id, status, updated]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskStatus"
        updated:
          type: boolean

    GraphNode:
      type: object
      additionalProperties: false
      required: [id, kind, label]
      properties:
        id:
          type: string
        kind:
          enum: [MEMO, TAG]
        label:
          type: string
        memoType:
          anyOf:
            - $ref: "#/components/schemas/ItemKind"
            - type: "null"
        taskState:
          type: [string, "null"]
          enum: [NONE, TODO, DONE, CANCELLED, null]
        overdue:
          type: boolean
          readOnly: true
    GraphEdge:
      type: object
      additionalProperties: false
      required: [id, source, target, kind]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        kind:
          const: MEMO_TAG
    GraphProjection:
      type: object
      additionalProperties: false
      required: [nodes, edges, truncated, projectionVersion]
      properties:
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        truncated:
          type: boolean
        projectionVersion:
          type: string
          format: uuid
