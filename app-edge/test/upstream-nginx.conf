worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null emerg;

events {
    worker_connections 32;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map_hash_bucket_size 512;

    map $request_method $synthetic_method_marker {
        default "other";
        GET "GET";
        HEAD "HEAD";
        POST "POST";
        PATCH "PATCH";
        DELETE "DELETE";
    }

    map "$host|$http_x_forwarded_host|$http_x_forwarded_proto|$http_x_forwarded_port" $synthetic_canonical_forwarding {
        default "false";
        "memo.synthetic.test|memo.synthetic.test|https|443" "true";
    }

    map "$http_authorization$http_forwarded$http_x_real_ip$http_x_forwarded_for$http_x_forwarded_prefix$http_x_forwarded_ssl$http_x_original_forwarded_for$http_x_original_url$http_x_rewrite_url$http_true_client_ip$http_cf_connecting_ip$http_cf_ray$http_cf_access_jwt_assertion$http_cf_access_authenticated_user_email$http_cf_access_client_id$http_cf_access_client_secret$http_x_public_edge_sentinel$http_referer$http_user_agent" $synthetic_untrusted_header_seen {
        default "true";
        "" "false";
    }

    map $http_cookie $synthetic_session_cookie_preserved {
        default "false";
        "~(?:^|;[ ]*)SESSION=synthetic-session(?:;|$)" "true";
    }

    map $http_cookie $synthetic_xsrf_cookie_preserved {
        default "false";
        "~(?:^|;[ ]*)XSRF-TOKEN=synthetic-cookie-xsrf(?:;|$)" "true";
    }

    map $http_cookie $synthetic_forbidden_cookies_removed {
        default "false";
        "SESSION=synthetic-session; XSRF-TOKEN=synthetic-cookie-xsrf" "true";
    }

    map $http_content_type $synthetic_h1 { default 0; application/json 1; }
    map $http_accept $synthetic_h2 { default 0; application/json 1; }
    map $http_origin $synthetic_h3 { default 0; "https://memo.synthetic.test" 1; }
    map $http_x_xsrf_token $synthetic_h4 { default 0; synthetic-xsrf 1; }
    map $http_x_expected_owner_id $synthetic_h5 { default 0; "00000000-0000-0000-0000-000000000001" 1; }
    map $http_idempotency_key $synthetic_h6 { default 0; synthetic-idempotency 1; }
    map $http_x_analysis_proposal_schema_version $synthetic_h7 { default 0; "3" 1; }
    map $http_if_none_match $synthetic_h8 { default 1; "" 0; }
    map $http_if_modified_since $synthetic_h9 { default 0; "Wed, 21 Oct 2015 07:28:00 GMT" 1; }
    map "$synthetic_h1$synthetic_h2$synthetic_h3$synthetic_h4$synthetic_h5$synthetic_h6$synthetic_h7$synthetic_h8$synthetic_h9" $synthetic_allowed_headers_preserved {
        default "false";
        "111111111" "true";
    }

    # $request_body becomes available while the proxy module prepares the renderer request. It is
    # reduced to a boolean before crossing that local-only hop; no submitted bytes are echoed.
    map $request_body $synthetic_body_preserved {
        default "true";
        "" "false";
    }

    map $uri $synthetic_route_class {
        default "rejected";
        / "fixture";
        /index.html "fixture";
        /login "fixture";
        /assets/app-abcdef12.js "hashed-static";
        /manifest.webmanifest "pwa";
        /sw.js "pwa";
        /registerSW.js "pwa";
        /api/v1/synthetic/echo "safe-echo";
        /api/v1/auth/login "auth-login";
        "~^/api/v1/auth/register;" "registration-sentinel";
    }

    log_format synthetic_safe
        'method=$synthetic_method_marker route_class=$synthetic_route_class '
        'status=$status bytes=$body_bytes_sent';

    access_log /dev/stdout synthetic_safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 5173;
        server_name _;

        client_max_body_size 256k;

        location = /_internal/health {
            access_log off;
            empty_gif;
        }

        location = / {
            default_type text/html;
            return 200 '<!doctype html><html><body>public-app-synthetic-fixture-v1</body></html>';
        }

        location = /index.html {
            default_type text/html;
            return 200 '<!doctype html><html><body>public-app-synthetic-fixture-v1</body></html>';
        }

        location = /login {
            default_type text/html;
            return 200 '<!doctype html><html><body>public-app-synthetic-login-fixture-v1</body></html>';
        }

        location = /assets/app-abcdef12.js {
            default_type application/javascript;
            add_header Cache-Control "private, max-age=1";
            return 200 'globalThis.__publicAppSyntheticFixture = true;';
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=3600";
            return 200 '{"name":"Public app synthetic fixture","start_url":"/"}\n';
        }

        location = /sw.js {
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600";
            return 200 'self.addEventListener("fetch", () => {});';
        }

        location = /registerSW.js {
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600";
            return 200 'globalThis.__publicAppRegisterSynthetic = true;';
        }

        location = /api/v1/synthetic/echo {
            try_files /__synthetic_no_local_file__ @synthetic_safe_echo;
        }

        location = /api/v1/auth/login {
            try_files /__synthetic_no_local_file__ @synthetic_safe_echo;
        }

        # Model Spring PathPattern's matrix-parameter handling. Any request reaching this sentinel
        # proves that the public edge failed to block the registration capability before proxying.
        location ^~ "/api/v1/auth/register;" {
            default_type application/json;
            return 201 '{"registrationHandlerReached":true}\n';
        }

        location @synthetic_safe_echo {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_pass_request_body on;
            proxy_set_header Host "synthetic-renderer";
            proxy_set_header X-Synthetic-Method $synthetic_method_marker;
            proxy_set_header X-Synthetic-Canonical-Forwarding $synthetic_canonical_forwarding;
            proxy_set_header X-Synthetic-Untrusted-Header-Seen $synthetic_untrusted_header_seen;
            proxy_set_header X-Synthetic-Session-Cookie-Preserved $synthetic_session_cookie_preserved;
            proxy_set_header X-Synthetic-Xsrf-Cookie-Preserved $synthetic_xsrf_cookie_preserved;
            proxy_set_header X-Synthetic-Forbidden-Cookies-Removed $synthetic_forbidden_cookies_removed;
            proxy_set_header X-Synthetic-Allowed-Headers-Preserved $synthetic_allowed_headers_preserved;
            proxy_set_header X-Synthetic-Body-Preserved $synthetic_body_preserved;
            proxy_set_header Connection "";
            proxy_intercept_errors off;
        }

        location / {
            return 404;
        }
    }

    # A loopback-only renderer emits only finite markers created above. It never receives original
    # headers and never includes request bytes in its response or logs.
    server {
        listen 127.0.0.1:8081;
        server_name synthetic-renderer;
        access_log off;

        location / {
            default_type application/json;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval'";
            add_header Set-Cookie "synthetic-upstream-cookie=1";
            return 200 '{"fixture":"public-app-synthetic-v1","method":"$http_x_synthetic_method","canonicalForwarding":$http_x_synthetic_canonical_forwarding,"untrustedHeadersSeen":$http_x_synthetic_untrusted_header_seen,"sessionCookiePreserved":$http_x_synthetic_session_cookie_preserved,"xsrfCookiePreserved":$http_x_synthetic_xsrf_cookie_preserved,"forbiddenCookiesRemoved":$http_x_synthetic_forbidden_cookies_removed,"allowedHeadersPreserved":$http_x_synthetic_allowed_headers_preserved,"bodyPreserved":$http_x_synthetic_body_preserved}\n';
        }

    }
}
