services:
  backend:
    networks:
      - default
      - calendar-publication

  calendar-feed-edge:
    build:
      context: ./calendar-edge
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PERSONAL_MEMO_CALENDAR_EDGE_PORT:-8787}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - calendar-publication

networks:
  calendar-publication:
    internal: true
