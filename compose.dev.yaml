services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_memo}
      POSTGRES_USER: ${POSTGRES_USER:-personal_memo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${PERSONAL_MEMO_POSTGRES_PORT:-5432}:5432"

  backend:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-personal_memo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-personal_memo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      SPRING_PROFILES_ACTIVE: dev
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      SESSION_COOKIE_SECURE: "false"
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_REGISTRATION_ENABLED: ${GOOGLE_REGISTRATION_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:5173/login/oauth2/code/google}
    ports:
      - "127.0.0.1:${PERSONAL_MEMO_BACKEND_PORT:-8080}:8080"

  frontend:
    ports:
      - "127.0.0.1:${PERSONAL_MEMO_FRONTEND_PORT:-5173}:5173"
