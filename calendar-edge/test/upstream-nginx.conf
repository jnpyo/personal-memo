worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null emerg;

events {
    worker_connections 32;
}

http {
    map $uri $upstream_safe_route {
        default "rejected";
        /calendar/v1/feed.ics "calendar-feed";
    }
    map "$host|$http_authorization|$http_cookie|$http_referer|$http_x_forwarded_for|$http_user_agent|$http_x_forwarded_proto" $unsafe_forwarded_header {
        default 1;
        "calendar-feed-internal||||||" 0;
    }
    map $arg_token $synthetic_token_result {
        default "invalid";
        ~^A "ok";
        ~^B "not-found";
        ~^C "failure";
    }

    log_format upstream_safe
        'method=$request_method route=$upstream_safe_route status=$status bytes=$body_bytes_sent';
    access_log /dev/stdout upstream_safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        location = /_internal/health {
            access_log off;
            empty_gif;
        }

        location = /calendar/v1/feed.ics {
            if ($unsafe_forwarded_header) {
                return 418;
            }
            if ($synthetic_token_result = "invalid") {
                return 400;
            }
            if ($synthetic_token_result = "not-found") {
                return 404;
            }
            if ($synthetic_token_result = "failure") {
                return 500;
            }
            default_type text/calendar;
            add_header Cache-Control "public, max-age=3600";
            add_header Referrer-Policy "unsafe-url";
            add_header Set-Cookie "must-not-cross-the-edge=1";
            return 200 "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nEND:VCALENDAR\r\n";
        }

        location / {
            return 500;
        }
    }
}
