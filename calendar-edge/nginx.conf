worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null emerg;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never log any client-controlled target: the query contains the bearer and a rejected path
    # could contain the same value. Only a fixed route classification is retained.
    map $uri $calendar_feed_safe_route {
        default "rejected";
        /calendar/v1/feed.ics "calendar-feed";
    }
    map $request_method $calendar_feed_safe_method {
        default "other";
        GET "GET";
        HEAD "HEAD";
    }

    log_format calendar_feed_edge_safe
        '[$time_local] method=$calendar_feed_safe_method route=$calendar_feed_safe_route '
        'status=$status bytes=$body_bytes_sent duration=${request_time}s';

    map $server_name $calendar_feed_limit_key {
        default "calendar-feed";
    }

    # This origin-side global bound remains meaningful behind a loopback tunnel whose immediate
    # peer address is shared by all clients. A chosen public operator must add its own external bound.
    limit_req_zone $calendar_feed_limit_key zone=calendar_feed_rate:1m rate=60r/m;
    limit_conn_zone $calendar_feed_limit_key zone=calendar_feed_connections:1m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        server_tokens off;
        access_log /dev/stdout calendar_feed_edge_safe;
        error_log /dev/null emerg;

        client_header_timeout 5s;
        client_body_timeout 5s;
        client_max_body_size 1k;
        client_header_buffer_size 1k;
        large_client_header_buffers 2 4k;
        keepalive_timeout 10s;
        keepalive_requests 20;
        send_timeout 10s;
        reset_timedout_connection on;

        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Every local rejection and intercepted upstream failure is the same bodyless response.
        # Rate limiting remains a distinct, bounded 429 but is bodyless as well.
        error_page 400 401 403 404 405 408 413 414 431 500 501 502 503 504 =404 /_internal/errors/not-found;
        error_page 429 =429 /_internal/errors/rate-limited;

        location = /_internal/errors/not-found {
            internal;
            default_type "";
            return 204;
        }

        location = /_internal/errors/rate-limited {
            internal;
            default_type "";
            return 204;
        }

        # Docker can probe this only from the container loopback. A public/tunnel peer is denied.
        location = /_internal/health {
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
            empty_gif;
        }

        location = /calendar/v1/feed.ics {
            # Raw-target equality prevents encoded-path, duplicate-argument, and extra-query
            # variants from reaching the backend. The canonical secret is URL-safe and needs no
            # percent encoding. These return-only conditions are evaluated before proxying.
            if ($request_method !~ ^(?:GET|HEAD)$) {
                return 404;
            }
            if ($request_uri !~ "^/calendar/v1/feed\\.ics\\?token=[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$") {
                return 404;
            }
            if ($content_length != "") {
                return 404;
            }
            if ($http_transfer_encoding != "") {
                return 404;
            }

            limit_req zone=calendar_feed_rate burst=20 nodelay;
            limit_req_status 429;
            limit_conn calendar_feed_connections 8;
            limit_conn_status 429;

            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_set_header Host "calendar-feed-internal";
            proxy_set_header Referer "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;
            proxy_next_upstream off;
            proxy_intercept_errors on;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 9 16k;
            proxy_busy_buffers_size 32k;
            proxy_max_temp_file_size 0;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Server;
            proxy_hide_header Set-Cookie;
            proxy_redirect off;
        }

        # The PWA, authenticated API, OAuth, health, and every other path stay private.
        location / {
            return 404;
        }
    }
}
