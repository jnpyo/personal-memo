version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:10'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:20'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      compose-image-patches:
        patterns:
          - '*'
        update-types:
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:40'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      backend-image-patches:
        patterns:
          - '*'
        update-types:
          - patch

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:50'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      frontend-image-patches:
        patterns:
          - '*'
        update-types:
          - patch
