name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate OpenAPI 3.1
        run: >-
          docker run --rm
          --mount type=bind,source="$PWD",target=/workspace,readonly
          redocly/cli:2.44.1
          lint /workspace/docs/openapi.yaml --extends=spec

  production-compose-contract:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: personal-memo-config-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: personal_memo_config_check
      POSTGRES_USER: personal_memo_config_check
      POSTGRES_PASSWORD: dummy-config-validation-only
      PERSONAL_MEMO_HTTPS_BIND_ADDRESS: 192.168.1.100
      PERSONAL_MEMO_HTTPS_PORT: '8443'
      PERSONAL_MEMO_TLS_CERT_FILE: /tmp/personal-memo-config-cert.pem
      PERSONAL_MEMO_TLS_KEY_FILE: /tmp/personal-memo-config-key.pem
    steps:
      - uses: actions/checkout@v5
      - name: Validate private deployment source contracts
        shell: pwsh
        run: ./scripts/personal/Test-PersonalMemoSourceContracts.ps1
      - name: Validate the production Compose overlay
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Validate the private-PC Compose overlay
        run: >-
          docker compose -f compose.yaml -f compose.prod.yaml -f compose.personal.yaml
          config --quiet
      - name: Validate the private-PC Nginx TLS configuration
        shell: bash
        run: |
          set -euo pipefail
          nginx_test_root="$(mktemp -d)"
          trap 'rm -rf "$nginx_test_root"' EXIT
          mkdir -p "$nginx_test_root/conf.d" "$nginx_test_root/personal-listeners" "$nginx_test_root/tls"
          sed 's|${API_PROXY_TARGET}|http://backend:8080|g' \
            frontend/nginx/default.conf > "$nginx_test_root/conf.d/default.conf"
          cp frontend/nginx/personal-tls-listener.conf \
            "$nginx_test_root/personal-listeners/personal-tls.conf"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=personal-memo-ci.invalid' \
            -keyout "$nginx_test_root/tls/server-key.pem" \
            -out "$nginx_test_root/tls/server-cert.pem"
          chmod -R a+rX "$nginx_test_root"
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --mount type=bind,source="$nginx_test_root/conf.d",target=/etc/nginx/conf.d,readonly \
            --mount type=bind,source="$nginx_test_root/personal-listeners",target=/etc/nginx/personal-listeners,readonly \
            --mount type=bind,source="$nginx_test_root/tls",target=/run/personal-memo/tls,readonly \
            nginxinc/nginx-unprivileged:1.29-alpine nginx -t

  personal-powershell-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse personal deployment scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath scripts\personal -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            foreach ($parseError in $errors) {
              Write-Error "$($_.Name): $($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) {
            throw 'One or more personal deployment scripts failed Windows PowerShell 5.1 parsing.'
          }
      - name: Validate private ACL and command contracts
        shell: powershell
        run: .\scripts\personal\Test-PersonalMemoSourceContracts.ps1
      - name: Validate Windows PowerShell UTF-8 and protected stdin
        shell: powershell
        run: .\scripts\personal\Test-PersonalMemoUtf8Capture.ps1
      - name: Validate cross-process password-rotation lock
        shell: powershell
        run: .\scripts\personal\Test-PersonalMemoRotationLock.ps1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: mvn -B verify
        working-directory: backend
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: 'true'
      - name: Upload deterministic evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/target/evaluation/deterministic-baseline.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Test frontend
        run: npm run test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [api-contract, production-compose-contract, personal-powershell-contract, backend, frontend]
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: personal-memo-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: personal_memo_e2e
      POSTGRES_USER: personal_memo_e2e
      POSTGRES_PASSWORD: e2e-only-password
      PERSONAL_MEMO_POSTGRES_PORT: '45432'
      PERSONAL_MEMO_BACKEND_PORT: '48080'
      PERSONAL_MEMO_FRONTEND_PORT: '45173'
      AUTH_REGISTRATION_ENABLED: 'true'
      GOOGLE_AUTH_ENABLED: 'true'
      GOOGLE_REGISTRATION_ENABLED: 'false'
      GOOGLE_CLIENT_ID: e2e-fake-client
      GOOGLE_CLIENT_SECRET: e2e-fake-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:45173/login/oauth2/code/google
      E2E_BASE_URL: http://127.0.0.1:45173
      E2E_GOOGLE_ENABLED: 'true'
      E2E_ALLOW_DESTRUCTIVE_CLEANUP: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start production-like stack
        run: docker compose -f compose.yaml -f compose.dev.yaml up -d --build
      - name: Wait for the PWA and API
        shell: bash
        run: |
          for _ in {1..60}; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${PERSONAL_MEMO_FRONTEND_PORT}/" >/dev/null \
              && curl --fail --silent --show-error \
              "http://127.0.0.1:${PERSONAL_MEMO_BACKEND_PORT}/api/v1/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run primary and OAuth-state E2E tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Capture Compose diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose -f compose.yaml -f compose.dev.yaml ps --all \
            2>&1 | tee artifacts/compose-ps.txt || true
          docker compose -f compose.yaml -f compose.dev.yaml logs --no-color --timestamps \
            2>&1 | tee artifacts/compose.log || true
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
            artifacts/compose.log
            artifacts/compose-ps.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the exact E2E stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.dev.yaml
          down --volumes --remove-orphans
