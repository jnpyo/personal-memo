services:
  postgres:
    image: postgres:18.6-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - personal-memo-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  personal-memo-postgres:
