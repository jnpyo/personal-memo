# Keep request logs useful for bounded operations without retaining client addresses, memo or
# proposal identifiers, search terms, OAuth state, or any other request target. Both the method and
# route are reduced to fixed classes before logging; raw URI/query/header/cookie values never enter
# the format.
map $request_method $personal_memo_safe_method {
    default "other";
    GET "GET";
    HEAD "HEAD";
    POST "POST";
    PATCH "PATCH";
    DELETE "DELETE";
}

map $uri $personal_memo_safe_route {
    default "app";
    /calendar/v1/feed.ics "calendar-feed";
    /api/v1/events/calendar.ics "calendar-export";
    ~^/(?:assets|icons)/ "static";
    ~^/(?:sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[0-9a-f]+\.js)$ "static";
    ~^/api/v1/auth(?:/|$) "auth";
    ~^/api(?:/|$) "api";
    ~^/(?:oauth2|login/oauth2)(?:/|$) "oauth";
}

log_format personal_memo_safe
    'method=$personal_memo_safe_method route=$personal_memo_safe_route '
    'status=$status bytes=$body_bytes_sent duration=$request_time';

map $uri $personal_memo_cache_control {
    default "no-cache";
    /calendar/v1/feed.ics "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/workbox-[0-9a-f]+\.js$ "public, max-age=31536000, immutable";
    ~^/(?:api|oauth2)(?:/|$) "no-store";
    ~^/login/oauth2(?:/|$) "no-store";
    ~^/(?:sw\.js|registerSW\.js|manifest\.webmanifest)$ "no-cache, no-store, must-revalidate";
}

map $uri $personal_memo_referrer_policy {
    default "strict-origin-when-cross-origin";
    /calendar/v1/feed.ics "no-referrer";
}

# The normal production listener is loopback-only and sits behind a trusted HTTPS edge. Preserve
# that edge's public values when they are well formed. The optional private-PC listener terminates
# TLS on port 8443 itself, so it ignores client-supplied forwarded scheme and port values.
map "$server_port:$http_x_forwarded_proto" $personal_memo_forwarded_proto {
    default $scheme;
    ~^8443: https;
    ~*^5173:https$ https;
    ~*^5173:http$ http;
}

map "$server_port:$http_x_forwarded_port" $personal_memo_forwarded_port {
    default $server_port;
    ~^8443: 8443;
    ~^5173:(?<personal_memo_edge_port>[0-9][0-9]?[0-9]?[0-9]?[0-9]?)$ $personal_memo_edge_port;
}

server {
    listen 5173;
    listen [::]:5173;
    include /etc/nginx/personal-listeners/*.conf;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log personal_memo_safe;
    # Request-scoped upstream errors can include raw targets and queries. Keep only emergency
    # process-level failures; the calendar location below remains stricter and discards even those.
    error_log /dev/stderr emerg;

    add_header Cache-Control $personal_memo_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy $personal_memo_referrer_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Private same-origin source proxy only. A separately approved public edge must expose only this
    # fixed path. The original query is forwarded implicitly so Spring can verify the bearer, but it
    # is never copied into a rewritten URI or request header. GET also permits HEAD in Nginx.
    location = /calendar/v1/feed.ics {
        limit_except GET {
            deny all;
        }

        # The inherited access log records only the fixed calendar-feed route class. Suppress
        # request-scoped upstream errors because Nginx error records can contain the original
        # query-bearing target.
        error_log /dev/null emerg;

        proxy_pass ${API_PROXY_TARGET};
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $personal_memo_forwarded_port;
        proxy_set_header X-Forwarded-Proto $personal_memo_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Set-Cookie;
        proxy_redirect off;
    }

    location ~ ^/(?:api(?:/|$)|oauth2(?:/|$)|login/oauth2(?:/|$)) {
        proxy_pass ${API_PROXY_TARGET};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $personal_memo_forwarded_port;
        proxy_set_header X-Forwarded-Proto $personal_memo_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_redirect off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        access_log off;
    }

    location = /sw.js {
        try_files $uri =404;
        access_log off;
    }

    location = /registerSW.js {
        try_files $uri =404;
        access_log off;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        access_log off;
    }

    location ~ ^/workbox-[0-9a-f]+\.js$ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
