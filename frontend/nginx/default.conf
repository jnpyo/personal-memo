map $uri $personal_memo_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/workbox-[0-9a-f]+\.js$ "public, max-age=31536000, immutable";
    ~^/(?:api|oauth2)(?:/|$) "no-store";
    ~^/login/oauth2(?:/|$) "no-store";
    ~^/(?:sw\.js|registerSW\.js|manifest\.webmanifest)$ "no-cache, no-store, must-revalidate";
}

# The production listener is loopback-only and sits behind a trusted HTTPS edge. Preserve the
# edge's public scheme and port when they are well formed; direct development traffic falls back
# to the connection values seen by this Nginx instance.
map $http_x_forwarded_proto $personal_memo_forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
}

map $http_x_forwarded_port $personal_memo_forwarded_port {
    default $server_port;
    ~^[0-9][0-9]?[0-9]?[0-9]?[0-9]?$ $http_x_forwarded_port;
}

server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    add_header Cache-Control $personal_memo_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(?:api(?:/|$)|oauth2(?:/|$)|login/oauth2(?:/|$)) {
        proxy_pass ${API_PROXY_TARGET};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $personal_memo_forwarded_port;
        proxy_set_header X-Forwarded-Proto $personal_memo_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_redirect off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        access_log off;
    }

    location = /sw.js {
        try_files $uri =404;
        access_log off;
    }

    location = /registerSW.js {
        try_files $uri =404;
        access_log off;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        access_log off;
    }

    location ~ ^/workbox-[0-9a-f]+\.js$ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
