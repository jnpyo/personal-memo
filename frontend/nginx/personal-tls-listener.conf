# Mounted only by compose.personal.yaml. The default production listener remains internal HTTP.
listen 8443 ssl;
listen [::]:8443 ssl;

ssl_certificate /run/personal-memo/tls/server-cert.pem;
ssl_certificate_key /run/personal-memo/tls/server-key.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:personal_memo_tls:1m;
ssl_session_timeout 10m;
ssl_session_tickets off;
